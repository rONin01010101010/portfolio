services:
  - type: web
    name: Portfolio-App
    env: static
    region: Toronto
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    # Custom headers to fix MIME types
    headers:
      - path: "/*.js"
        name: Content-Type
        value: "application/javascript; charset=utf-8"
      - path: "/*.mjs"
        name: Content-Type
        value: "application/javascript; charset=utf-8"
      - path: "/*.css"
        name: Content-Type
        value: "text/css; charset=utf-8"
      - path: "/*.json"
        name: Content-Type
        value: "application/json; charset=utf-8"
      - path: "/assets/*.js"
        name: Content-Type
        value: "application/javascript; charset=utf-8"
      - path: "/assets/*.css"
        name: Content-Type
        value: "text/css; charset=utf-8"
      - path: "/*"
        name: X-Content-Type-Options
        value: "nosniff"
      - path: "/*"
        name: X-Frame-Options
        value: "DENY"

    # Routes for SPA
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"